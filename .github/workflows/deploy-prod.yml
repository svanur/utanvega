name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    uses: ./.github/workflows/backend-build.yml
    secrets: inherit

  deploy:
    name: Deploy to Fly.io Production
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2025-08-12

      - run: flyctl deploy --app backend-wispy-forest-1686 --remote-only --build-arg GIT_HASH=${{ github.sha }}
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
