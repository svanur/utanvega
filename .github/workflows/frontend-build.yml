name: Frontend Build

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "20"
      working-directory:
        type: string
        required: false
        default: "frontend"
      install-command:
        type: string
        required: false
        default: "npm ci"
      build-command:
        type: string
        required: false
        default: "npm run build"
      lint-command:
        type: string
        required: false
        default: "npm run lint"
      test-command:
        type: string
        required: false
        default: ""
      artifact-name:
        type: string
        required: false
        default: "frontend-build"

permissions:
  contents: read

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      # Node 20's bundled npm (10.8.2) fails "npm ci" against a lockfile written by npm 11 with
      # a root "overrides" entry — npm 10's ci validator expects a redundant unselected-version
      # lockfile entry that npm 11 doesn't write, and errors "Missing: X from lock file" even
      # though the tree it would produce is identical. Pin npm to the version package-lock.json
      # was generated with so "npm ci" validates cleanly.
      - name: Use npm 11
        run: npm install -g npm@11.10.1

      # Installs from the repo root, not ${{ inputs.working-directory }}: frontend and admin are
      # npm workspace members sharing the one root package-lock.json (see packages/shared) — a
      # per-directory install can no longer resolve the "shared" workspace dependency on its own.
      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Test
        if: inputs.test-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist
          if-no-files-found: warn